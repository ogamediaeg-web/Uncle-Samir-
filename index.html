<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منيو عم سمير بتاع الفطير | Uncle Samir Feteer Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-bg" style="background-image: url('bg_shop.jpg');"></div>
  <div class="page-bg-overlay"></div>

  <div id="promo-banner" class="promo-banner hidden">
    <div class="container promo-inner">
      <span id="promo-banner-text"></span>
    </div>
  </div>

  <header class="shop-header">
    <div class="container header-inner">
      <div class="brand-block">
        <img src="logo.jpg" alt="عم سمير بتاع الفطير" class="brand-logo" />
        <div>
          <h1 class="brand-title">عم سمير بتاع الفطير</h1>
          <p class="brand-sub">فطير مشلتت، حادق، حلو، وحاجة روقة سخنة من الفرن</p>
          <span id="shop-status-badge" class="status-badge open">🟢 مفتوح ويستقبل الطلبات</span>
        </div>
      </div>

      <div class="header-actions">
        <div class="lang-switch">
          <button type="button" class="lang-btn active" data-lang="ar">عربي</button>
          <button type="button" class="lang-btn" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="fr">FR</button>
        </div>
        <a id="hotline-link" href="tel:17205" class="btn-gold">📞 17205</a>
      </div>
    </div>
  </header>

  <main class="container main-content">
    <div class="toolbar">
      <input type="text" id="menu-search" class="form-input search-input" placeholder="ابحث عن فطيرة أو صنف..." />
      <div id="category-tabs" class="category-tabs"></div>
    </div>

    <div id="menu-grid" class="menu-grid"></div>
  </main>

  <button type="button" id="open-cart-btn" class="floating-cart-btn">
    🛒 السلة (<span id="cart-count">0</span>) • <span id="cart-total-preview">0</span> ج.م
  </button>

  <div id="cart-drawer" class="drawer-backdrop hidden">
    <div class="drawer-panel">
      <div class="drawer-header">
        <h3>سلة الطلبات</h3>
        <button type="button" id="close-cart-btn" class="close-btn">✕</button>
      </div>
      <div id="cart-items-list" class="drawer-body"></div>
      <div class="drawer-footer">
        <div class="form-group">
          <label>منطقة التوصيل</label>
          <select id="delivery-zone-select" class="form-input"></select>
        </div>
        <div class="form-grid-2">
          <input type="text" id="customer-name" class="form-input" placeholder="الاسم" />
          <input type="tel" id="customer-phone" class="form-input" placeholder="رقم الموبايل" />
        </div>
        <input type="text" id="customer-address" class="form-input mt-2" placeholder="العنوان بالتفصيل" />
        <div class="summary-lines">
          <div><span>الأصناف:</span><strong id="subtotal-val">0 ج.م</strong></div>
          <div><span>التوصيل:</span><strong id="delivery-val">0 ج.م</strong></div>
          <div class="grand-total"><span>الإجمالي:</span><strong id="grand-total-val">0 ج.م</strong></div>
        </div>
        <button type="button" id="submit-whatsapp-order" class="btn-primary" style="width:100%;">إرسال الطلب عبر واتساب ✓</button>
      </div>
    </div>
  </div>

  <div id="toast-box" class="toast-box hidden"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, doc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBtgpiZ8WvePAifWGmfL7Pv4AO41JzSuMg",
      authDomain: "uncle-samir.firebaseapp.com",
      projectId: "uncle-samir",
      storageBucket: "uncle-samir.firebasestorage.app",
      messagingSenderId: "426745500615",
      appId: "1:426745500615:web:2dc8ac6fe717980eeebfe2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const menuDocRef = doc(db, "menus", "uncle_samir_main");

    (async () => {
      try {
        const snap = await getDoc(menuDocRef);
        if (snap.exists() && snap.data().payload && window.applyRemoteMenuData) {
          window.applyRemoteMenuData(JSON.parse(snap.data().payload));
        }
        onSnapshot(menuDocRef, (s) => {
          if (s.exists() && s.data().payload && window.applyRemoteMenuData) {
            window.applyRemoteMenuData(JSON.parse(s.data().payload));
          }
        });
      } catch (e) {}
    })();
  </script>

  <script src="data.js"></script>
  <script>
    const STORAGE_KEY = "uncle_samir_menu_v1";
    let state = (() => {
      try {
        const s = localStorage.getItem(STORAGE_KEY);
        if (s) {
          const parsed = JSON.parse(s);
          if (parsed && Array.isArray(parsed.items) && parsed.items.length > 0) {
            return {
              ...DEFAULT_DATA,
              ...parsed,
              categories: (Array.isArray(parsed.categories) && parsed.categories.length > 0) ? parsed.categories : DEFAULT_DATA.categories,
              zones: (Array.isArray(parsed.zones) && parsed.zones.length > 0) ? parsed.zones : DEFAULT_DATA.zones,
              settings: { ...DEFAULT_DATA.settings, ...(parsed.settings || {}) }
            };
          }
        }
      } catch (e) {}
      return JSON.parse(JSON.stringify(DEFAULT_DATA));
    })();

    let activeCategory = "all";
    let activeLang = "ar";
    let cart = [];

    window.applyRemoteMenuData = function(remote) {
      if (!remote || typeof remote !== "object") return;
      const mergedItems = (Array.isArray(remote.items) && remote.items.length > 0)
        ? remote.items
        : ((Array.isArray(state.items) && state.items.length > 0) ? state.items : DEFAULT_DATA.items);
      const mergedCats = (Array.isArray(remote.categories) && remote.categories.length > 0)
        ? remote.categories
        : ((Array.isArray(state.categories) && state.categories.length > 0) ? state.categories : DEFAULT_DATA.categories);
      const mergedZones = (Array.isArray(remote.zones) && remote.zones.length > 0)
        ? remote.zones
        : ((Array.isArray(state.zones) && state.zones.length > 0) ? state.zones : DEFAULT_DATA.zones);
      const mergedSettings = {
        ...DEFAULT_DATA.settings,
        ...(state.settings || {}),
        ...(remote.settings || {})
      };

      state = {
        ...DEFAULT_DATA,
        ...state,
        ...remote,
        items: mergedItems,
        categories: mergedCats,
        zones: mergedZones,
        settings: mergedSettings
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      renderMenu();
    };

    function showToast(msg) {
      const box = document.getElementById("toast-box");
      box.textContent = msg;
      box.classList.remove("hidden");
      clearTimeout(box._t);
      box._t = setTimeout(() => box.classList.add("hidden"), 2200);
    }

    function getItemTitle(item) {
      if (activeLang === "en") return item.en || item.ar;
      if (activeLang === "fr") return item.fr || item.en || item.ar;
      return item.ar;
    }

    function getItemDesc(item) {
      if (activeLang === "en") return item.descEn || item.descAr || "";
      return item.descAr || "";
    }

    function renderMenu() {
      const st = state.settings || {};
      const promo = document.getElementById("promo-banner");
      const promoTxt = document.getElementById("promo-banner-text");
      if (st.promoActive && st.promoText) {
        promo.classList.remove("hidden");
        promoTxt.textContent = st.promoText;
      } else {
        promo.classList.add("hidden");
      }

      const statusBadge = document.getElementById("shop-status-badge");
      const statusVal = st.status || "open";
      statusBadge.className = "status-badge " + statusVal;
      if (statusVal === "open") statusBadge.textContent = "🟢 مفتوح ويستقبل الطلبات";
      else if (statusVal === "busy") statusBadge.textContent = "🟠 ضغط طلبات حالياً";
      else statusBadge.textContent = "🔴 مغلق مؤقتاً";

      const hotline = st.hotline || "17205";
      const hlLink = document.getElementById("hotline-link");
      hlLink.href = "tel:" + hotline;
      hlLink.textContent = "📞 " + hotline;

      const tabsEl = document.getElementById("category-tabs");
      const cats = [{ id: "all", ar: "الكل", en: "All", fr: "Tout" }, ...(state.categories || [])];
      tabsEl.innerHTML = cats.map(c => {
        const label = activeLang === "en" ? (c.en || c.ar) : activeLang === "fr" ? (c.fr || c.ar) : c.ar;
        return `<button type="button" class="cat-tab ${activeCategory === c.id ? 'active' : ''}" data-cat="${c.id}">${label}</button>`;
      }).join("");

      tabsEl.querySelectorAll(".cat-tab").forEach(btn => {
        btn.addEventListener("click", () => {
          activeCategory = btn.dataset.cat;
          renderMenu();
        });
      });

      const q = (document.getElementById("menu-search").value || "").trim().toLowerCase();
      const filtered = (state.items || []).filter(item => {
        const catMatch = activeCategory === "all" || item.cat === activeCategory;
        const searchMatch = !q || ((item.ar || "") + " " + (item.en || "") + " " + (item.descAr || "")).toLowerCase().includes(q);
        return catMatch && searchMatch;
      });

      const grid = document.getElementById("menu-grid");
      grid.innerHTML = filtered.map(item => {
        const disabled = !item.available || statusVal === "closed";
        const priceBtns = item.p2
          ? `
            <button type="button" class="btn-add" ${disabled ? "disabled" : ""} onclick="addToCart('${item.id}', 'وسط', ${item.p1})">وسط ${item.p1} ج.م +</button>
            <button type="button" class="btn-add secondary" ${disabled ? "disabled" : ""} onclick="addToCart('${item.id}', 'كبير', ${item.p2})">كبير ${item.p2} ج.م +</button>
          `
          : `<button type="button" class="btn-add" ${disabled ? "disabled" : ""} onclick="addToCart('${item.id}', '', ${item.p1})">${item.p1} ج.م • أضف +</button>`;

        return `
          <article class="menu-card ${!item.available ? 'unavailable' : ''}">
            <img src="${item.img || 'savory_feteer.jpg'}" alt="${getItemTitle(item)}" class="menu-img" />
            <div class="menu-card-body">
              <div class="menu-card-top">
                <h3>${getItemTitle(item)}</h3>
                ${!item.available ? '<span class="soldout-tag">نفذت الكمية</span>' : ''}
              </div>
              <p class="menu-desc">${getItemDesc(item)}</p>
              <div class="price-actions">${priceBtns}</div>
            </div>
          </article>
        `;
      }).join("");

      const zoneSel = document.getElementById("delivery-zone-select");
      const currentZone = zoneSel.value;
      zoneSel.innerHTML = (state.zones || []).map(z => `<option value="${z.fee}" data-name="${z.ar}">${z.ar} (${z.fee} ج.م)</option>`).join("");
      if (currentZone) zoneSel.value = currentZone;
      updateCartSummary();
    }

    window.addToCart = function(id, sizeLabel, price) {
      const item = (state.items || []).find(i => i.id === id);
      if (!item || !item.available) return;
      const key = id + "_" + sizeLabel;
      const existing = cart.find(c => c.key === key);
      const displayName = sizeLabel ? `${item.ar} (${sizeLabel})` : item.ar;
      if (existing) existing.qty += 1;
      else cart.push({ key, id, name: displayName, price: Number(price), qty: 1 });
      updateCartSummary();
      showToast("تمت الإضافة: " + displayName);
    };

    window.changeQty = function(key, delta) {
      const idx = cart.findIndex(c => c.key === key);
      if (idx === -1) return;
      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      updateCartSummary();
      renderCartItems();
    };

    function updateCartSummary() {
      const count = cart.reduce((acc, c) => acc + c.qty, 0);
      const subtotal = cart.reduce((acc, c) => acc + c.price * c.qty, 0);
      const delivery = Number(document.getElementById("delivery-zone-select").value || 0);
      const total = subtotal + delivery;

      document.getElementById("cart-count").textContent = count;
      document.getElementById("cart-total-preview").textContent = subtotal;
      document.getElementById("subtotal-val").textContent = subtotal + " ج.م";
      document.getElementById("delivery-val").textContent = delivery + " ج.م";
      document.getElementById("grand-total-val").textContent = total + " ج.م";
    }

    function renderCartItems() {
      const list = document.getElementById("cart-items-list");
      if (cart.length === 0) {
        list.innerHTML = `<p class="muted-text text-center">السلة فارغة حالياً</p>`;
        return;
      }
      list.innerHTML = cart.map(c => `
        <div class="cart-row">
          <div>
            <strong>${c.name}</strong>
            <div class="muted-text">${c.price * c.qty} ج.م</div>
          </div>
          <div class="qty-controls">
            <button type="button" onclick="changeQty('${c.key}', -1)">-</button>
            <span>${c.qty}</span>
            <button type="button" onclick="changeQty('${c.key}', 1)">+</button>
          </div>
        </div>
      `).join("");
    }

    document.getElementById("open-cart-btn").addEventListener("click", () => {
      renderCartItems();
      document.getElementById("cart-drawer").classList.remove("hidden");
    });

    document.getElementById("close-cart-btn").addEventListener("click", () => {
      document.getElementById("cart-drawer").classList.add("hidden");
    });

    document.getElementById("delivery-zone-select").addEventListener("change", updateCartSummary);
    document.getElementById("menu-search").addEventListener("input", renderMenu);

    document.querySelectorAll(".lang-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeLang = btn.dataset.lang;
        renderMenu();
      });
    });

    document.getElementById("submit-whatsapp-order").addEventListener("click", () => {
      if (cart.length === 0) {
        showToast("أضف أصنافاً للسلة أولاً");
        return;
      }
      const name = document.getElementById("customer-name").value.trim() || "عميل";
      const phone = document.getElementById("customer-phone").value.trim();
      const address = document.getElementById("customer-address").value.trim();
      const zoneSel = document.getElementById("delivery-zone-select");
      const zoneName = zoneSel.options[zoneSel.selectedIndex]?.dataset?.name || "";
      const delivery = Number(zoneSel.value || 0);
      const subtotal = cart.reduce((acc, c) => acc + c.price * c.qty, 0);
      const total = subtotal + delivery;
      const waNumber = (state.settings && state.settings.orderWhatsapp) || "201124349186";

      const lines = [
        "طلب جديد - عم سمير بتاع الفطير",
        "الاسم: " + name,
        phone ? "الموبايل: " + phone : "",
        zoneName ? "المنطقة: " + zoneName : "",
        address ? "العنوان: " + address : "",
        "--- الأصناف ---",
        ...cart.map(c => `• ${c.name} ×${c.qty} = ${c.price * c.qty} ج.م`),
        "التوصيل: " + delivery + " ج.م",
        "الإجمالي: " + total + " ج.م"
      ].filter(Boolean).join("
");

      const url = `https://wa.me/${waNumber}?text=${encodeURIComponent(lines)}`;
      window.open(url, "_blank");
    });

    renderMenu();
  </script>
</body>
</html>
