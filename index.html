<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page-bg" style="background-image:url('bg_shop.jpg')"></div><div class="page-bg-overlay"></div>
<header class="hero" style="--bg:url('bg_shop.jpg')">
 <div class="container">
  <div class="topbar"><div class="lang" id="lang"></div><a class="admin-link" href="admin.html" id="t-admin"></a></div>
  <img class="logo" src="logo.jpg" alt="عم سمير">
  <h1 id="t-title"></h1><p id="t-sub"></p>
  <a class="hotline" id="hot" href="tel:17205">17205</a>
 </div>
</header>
<div id="status" class="status hidden"></div>
<div id="promo" class="promo hidden"><span id="promo-t"></span></div>
<div class="nav"><div class="container">
 <input id="q" class="form-input"><div class="chips" id="chips"></div>
</div></div>
<main class="container" id="menu"></main>
<footer class="container">
 <div id="t-foot"></div>
 <div>تصميم وتطوير manar adel</div>
 <a href="https://wa.me/201124349186" target="_blank" rel="noopener">💬 01124349186</a>
</footer>
<div class="cartbar hidden" id="cartbar"><div><b id="cb-n"></b> • <b id="cb-t"></b></div><button class="btn-gold" id="cb-open"></button></div>
<div class="drawer-bg hidden" id="dbg"><div class="drawer" id="drawer"></div></div>
<div id="toast" class="toast-box hidden"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import {getFirestore,doc,onSnapshot,setDoc} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
const fb=initializeApp({apiKey:"AIzaSyBtgpiZ8WvePAifWGmfL7Pv4AO41JzSuMg",authDomain:"uncle-samir.firebaseapp.com",projectId:"uncle-samir",storageBucket:"uncle-samir.firebasestorage.app",messagingSenderId:"426745500615",appId:"1:426745500615:web:2dc8ac6fe717980eeebfe2"});
const db=getFirestore(fb);
window.saveOrder=(o)=>setDoc(doc(db,"orders",o.id),o).catch(()=>{});
onSnapshot(doc(db,"menus","uncle_samir_main"),s=>{if(s.exists()&&s.data().payload){const d=JSON.parse(s.data().payload);if(d&&d.items){window.__setState(d);}}},()=>{});
</script>
<script src="data.js"></script>
<script>
const KEY="uncle_samir_menu_v1";
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.items)S=JSON.parse(JSON.stringify(DEFAULT_DATA));
let lang=localStorage.getItem("us_lang")||"ar",cart={},type="delivery",qtext="",ctab="";
const T={
ar:{title:"عم سمير بتاع الفطير",sub:"أحلى فطير وحواوشي في مصر",search:"ابحث في المنيو...",add:"إضافة",cart:"عرض السلة",items:"أصناف",cur:"ج.م",cart_t:"سلتك",empty:"السلة فاضية",delivery:"توصيل",pickup:"استلام",dine:"صالة",zone:"اختر المنطقة",addr:"العنوان بالتفصيل",table:"رقم الطاولة",name:"الاسم",phone:"رقم الموبايل",note:"ملاحظات",sub_t:"المجموع",fee:"التوصيل",total:"الإجمالي",send:"إرسال الطلب على واتساب",na:"غير متاح حالياً",closed:"المطعم مغلق مؤقتاً ولا يستقبل طلبات",busy:"ضغط طلبات حالياً، قد يتأخر التوصيل قليلاً",admin:"دخول",need:"من فضلك أكمل البيانات المطلوبة",foot:"جميع الأسعار شاملة الضريبة",roka:"غير مسموح الاقتراب أو محاولة التقليد",rokaT:"الحاجة روقة",close:"إغلاق",order:"طلب جديد"},
en:{title:"Uncle Samir – Feteer",sub:"Egypt's best feteer & hawawshi",search:"Search the menu...",add:"Add",cart:"View cart",items:"items",cur:"EGP",cart_t:"Your cart",empty:"Your cart is empty",delivery:"Delivery",pickup:"Pickup",dine:"Dine-in",zone:"Choose zone",addr:"Full address",table:"Table number",name:"Name",phone:"Mobile number",note:"Notes",sub_t:"Subtotal",fee:"Delivery",total:"Total",send:"Send order via WhatsApp",na:"Unavailable",closed:"We are temporarily closed",busy:"High demand, delivery may be slightly delayed",admin:"Login",need:"Please complete the required fields",foot:"All prices include tax",roka:"Approaching or imitating is not allowed",rokaT:"Haga Roka",close:"Close",order:"New order"},
fr:{title:"Oncle Samir – Feteer",sub:"Le meilleur feteer d'Égypte",search:"Rechercher...",add:"Ajouter",cart:"Voir le panier",items:"articles",cur:"EGP",cart_t:"Votre panier",empty:"Panier vide",delivery:"Livraison",pickup:"À emporter",dine:"Sur place",zone:"Choisir la zone",addr:"Adresse complète",table:"Numéro de table",name:"Nom",phone:"Téléphone",note:"Remarques",sub_t:"Sous-total",fee:"Livraison",total:"Total",send:"Envoyer par WhatsApp",na:"Indisponible",closed:"Fermé temporairement",busy:"Forte demande, livraison légèrement retardée",admin:"Connexion",need:"Veuillez remplir les champs requis",foot:"Tous les prix incluent la taxe",roka:"Interdit de s'approcher ou d'imiter",rokaT:"Haga Roka",close:"Fermer",order:"Nouvelle commande"}};
const $=id=>document.getElementById(id);
const tr=k=>T[lang][k];
const nm=(o)=>lang==="ar"?o.ar:(o[lang]||o.en||o.ar);
const sz=(c,i)=>c["s"+i]?({ar:c["s"+i],en:i==1?"Medium":"Large",fr:i==1?"Moyen":"Grand"})[lang]:"";
const esc=s=>String(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function toast(m){const t=$("toast");t.textContent=m;t.classList.remove("hidden");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add("hidden"),2200)}
window.__setState=d=>{S=d;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()};
function chrome(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 $("t-title").textContent=tr("title");$("t-sub").textContent=tr("sub");$("q").placeholder=tr("search");$("t-admin").textContent="🔐 "+tr("admin");$("t-foot").textContent=tr("foot");$("cb-open").textContent=tr("cart");
 $("lang").innerHTML=["ar","en","fr"].map(l=>`<button class="${l===lang?"on":""}" data-l="${l}">${l.toUpperCase()}</button>`).join("");
 const h=S.settings.hotline||"17205";$("hot").textContent="📞 "+h;$("hot").href="tel:"+h;
 const st=$("status"),s=S.settings.status;
 st.className="status "+s+(s==="open"?" hidden":"");st.textContent=s==="closed"?tr("closed"):s==="busy"?tr("busy"):"";
 const p=$("promo");p.classList.toggle("hidden",!(S.settings.promoActive&&S.settings.promoText));$("promo-t").textContent=S.settings.promoText||"";
}
function card(i,c){
 const off=!i.available||S.settings.status==="closed";
 const btn=(n,p)=>`<button class="pbtn" ${off?"disabled":""} data-add="${i.id}" data-s="${n}"><span>${n&&sz(c,n)?sz(c,n)+" ":""}${p} ${tr("cur")}</span><b>+</b></button>`;
 return `<div class="card ${i.available?"":"off"}"><h3>${esc(nm(i))}</h3><p>${esc(lang==="ar"?i.descAr:(i.descEn||i.descAr))}</p>
 ${i.available?"":`<span class="muted-text">⛔ ${tr("na")}</span>`}
 <div class="prices">${i.p2?btn(1,i.p1)+btn(2,i.p2):btn(0,i.p1)}</div></div>`;
}
function render(){
 chrome();
 const q=qtext.toLowerCase();let chips="",html="";
 S.categories.forEach(c=>{
  const its=S.items.filter(i=>i.cat===c.id&&(!q||(i.ar+" "+(i.en||"")).toLowerCase().includes(q)));
  if(!its.length)return;
  chips+=`<button class="chip" data-go="${c.id}">${esc(nm(c))}</button>`;
  html+=`<div class="cat-head" id="c-${c.id}"><img src="${c.img||"logo.jpg"}" alt=""><h2>${esc(nm(c))}</h2></div>`;
  if(c.id==="roka")html+=`<div class="roka"><img src="haga_roka.jpg" alt=""><div><h3>${tr("rokaT")}</h3><p>${tr("roka")}</p></div></div><div style="height:12px"></div>`;
  html+=`<div class="grid">${its.map(i=>card(i,c)).join("")}</div>`;
 });
 $("chips").innerHTML=chips;$("menu").innerHTML=html;cartBar();
}
const cartKey=(id,s)=>id+"|"+s;
const lines=()=>Object.entries(cart).map(([k,qty])=>{const [id,s]=k.split("|");const i=S.items.find(x=>x.id===id);if(!i)return null;const c=S.categories.find(x=>x.id===i.cat);const price=s==="2"?i.p2:i.p1;return{k,i,c,s,qty,price,name:nm(i)+(s!=="0"&&sz(c,s)?" ("+sz(c,s)+")":"")}}).filter(Boolean);
const sub=()=>lines().reduce((a,l)=>a+l.price*l.qty,0);
function cartBar(){const n=lines().reduce((a,l)=>a+l.qty,0);$("cartbar").classList.toggle("hidden",!n);$("cb-n").textContent=n+" "+tr("items");$("cb-t").textContent=sub()+" "+tr("cur")}
let lastTap=0;
document.addEventListener("click",e=>{
 const a=e.target.closest("[data-add]");
 if(a){const now=Date.now();if(now-lastTap<450)return;lastTap=now;const k=cartKey(a.dataset.add,a.dataset.s);cart[k]=(cart[k]||0)+1;cartBar();toast("✓ "+tr("add"));return}
 const g=e.target.closest("[data-go]");if(g){$("c-"+g.dataset.go).scrollIntoView();return}
 const l=e.target.closest("[data-l]");if(l){lang=l.dataset.l;localStorage.setItem("us_lang",lang);render();return}
 const qb=e.target.closest("[data-q]");if(qb){const k=qb.dataset.k;cart[k]=(cart[k]||0)+Number(qb.dataset.q);if(cart[k]<=0)delete cart[k];openCart();cartBar();return}
 const ty=e.target.closest("[data-type]");if(ty){type=ty.dataset.type;openCart(true);return}
 if(e.target.id==="dbg"||e.target.id==="x")$("dbg").classList.add("hidden");
});
$("q").addEventListener("input",e=>{qtext=e.target.value.trim();render()});
$("cb-open").onclick=()=>openCart();
let form={};
function keep(){["f-name","f-phone","f-zone","f-addr","f-table","f-note"].forEach(id=>{const el=$(id);if(el)form[id]=el.value})}
function openCart(keepForm){
 if(keepForm)keep();
 const ls=lines();const d=$("drawer");
 if(!ls.length){d.innerHTML=`<h2>${tr("cart_t")}</h2><p class="muted-text">${tr("empty")}</p><button class="btn-dark-red" id="x">${tr("close")}</button>`;$("dbg").classList.remove("hidden");return}
 const fee=type==="delivery"?(Number((S.zones.find(z=>z.id===form["f-zone"])||{}).fee)||0):0;
 d.innerHTML=`<h2>🛒 ${tr("cart_t")}</h2>
 ${ls.map(l=>`<div class="line"><div><b>${esc(l.name)}</b><div class="muted-text">${l.price} ${tr("cur")}</div></div><div class="qty"><button data-q="-1" data-k="${l.k}">−</button><b>${l.qty}</b><button data-q="1" data-k="${l.k}">+</button></div></div>`).join("")}
 <div class="seg">${["delivery","pickup","dine"].map(t=>`<button data-type="${t}" class="${t===type?"on":""}">${tr(t)}</button>`).join("")}</div>
 <div class="form-grid-2">
  <div><label>${tr("name")} *</label><input id="f-name" class="form-input" value="${esc(form["f-name"])}"></div>
  <div><label>${tr("phone")} *</label><input id="f-phone" type="tel" class="form-input" value="${esc(form["f-phone"])}"></div>
  ${type==="delivery"?`<div><label>${tr("zone")} *</label><select id="f-zone" class="form-input"><option value="">—</option>${S.zones.map(z=>`<option value="${z.id}" ${form["f-zone"]===z.id?"selected":""}>${esc(lang==="ar"?z.ar:(z.en||z.ar))} (${z.fee} ${tr("cur")})</option>`).join("")}</select></div><div><label>${tr("addr")} *</label><input id="f-addr" class="form-input" value="${esc(form["f-addr"])}"></div>`:""}
  ${type==="dine"?`<div><label>${tr("table")} *</label><input id="f-table" class="form-input" value="${esc(form["f-table"])}"></div>`:""}
 </div>
 <div class="mt-2"><label>${tr("note")}</label><input id="f-note" class="form-input" value="${esc(form["f-note"])}"></div>
 <div class="line"><span>${tr("sub_t")}</span><b>${sub()} ${tr("cur")}</b></div>
 ${type==="delivery"?`<div class="line"><span>${tr("fee")}</span><b>${fee} ${tr("cur")}</b></div>`:""}
 <div class="total"><span>${tr("total")}</span><span>${sub()+fee} ${tr("cur")}</span></div>
 <button class="btn-primary" style="width:100%" id="send">${tr("send")}</button>
 <button class="btn-text-danger" id="x" style="width:100%;margin-top:8px">${tr("close")}</button>`;
 $("dbg").classList.remove("hidden");
 const z=$("f-zone");if(z)z.onchange=()=>openCart(true);
 $("send").onclick=send;
}
let sending=false;
function send(){
 if(sending)return;keep();
 const g=k=>(form[k]||"").trim();
 if(S.settings.status==="closed")return toast(tr("closed"));
 if(!g("f-name")||!g("f-phone")||(type==="delivery"&&(!g("f-zone")||!g("f-addr")))||(type==="dine"&&!g("f-table")))return toast(tr("need"));
 sending=true;setTimeout(()=>sending=false,4000);
 const ls=lines(),z=S.zones.find(z=>z.id===g("f-zone")),fee=type==="delivery"&&z?Number(z.fee)||0:0,total=sub()+fee;
 const id="US"+Date.now().toString().slice(-7);
 const typeAr={delivery:"توصيل للمنزل",pickup:"استلام من الفرع",dine:"داخل المطعم"}[type];
 let m=`🛎️ *طلب جديد ${id} - عم سمير بتاع الفطير*\n\n`+ls.map(l=>`• ${l.i.ar}${l.s!=="0"&&l.c["s"+l.s]?" ("+l.c["s"+l.s]+")":""} ×${l.qty} = ${l.price*l.qty} ج.م`).join("\n")+`\n\n📦 النوع: ${typeAr}\n👤 ${g("f-name")}\n📞 ${g("f-phone")}`;
 if(type==="delivery")m+=`\n📍 ${z.ar}\n🏠 ${g("f-addr")}\n🛵 التوصيل: ${fee} ج.م`;
 if(type==="dine")m+=`\n🪑 طاولة: ${g("f-table")}`;
 if(g("f-note"))m+=`\n📝 ${g("f-note")}`;
 m+=`\n\n💰 *الإجمالي: ${total} ج.م*`;
 window.saveOrder&&window.saveOrder({id,customer:g("f-name"),phone:g("f-phone"),type:typeAr,date:new Date().toLocaleString("ar-EG"),ts:Date.now(),items:ls.map(l=>({name:l.i.ar,qty:l.qty})),total});
 window.open("https://wa.me/"+(S.settings.orderWhatsapp||"201124349186")+"?text="+encodeURIComponent(m),"_blank");
 cart={};form={};$("dbg").classList.add("hidden");cartBar();
}
render();
</script>
</body></html>
